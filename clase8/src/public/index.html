<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BigMac - McDonalds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
  <body>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-4 offset-md-2 text-end">
                <img src="/images/big-mac.png" alt="BigMac" class="img-fluid">
            </div>
            <div class="col-md-4">
                <h1>Big Mac</h1>
                <p>Quizás sean las dos hamburguesas de carne 100% vacuna con esa salsa especial y queso derretido, el toque de cebolla y la frescura de la lechuga o el crocante del pepino, lo que la hace la hamburguesa más famosa del mundo. Un sabor único.</p>
                <p><button class="btn btn-warning fw-bold">Agregar al Carrito</button></p>
            </div>
        </div>
    </div>
    <div class="container">
      <div class="row">
        <div class="col-md-4 offset-md-2">
          <form>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre">
              <div id="nombreError"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo</label>
              <select class="form-select" id="tipo" name="tipo">
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary" onClick="handleSubmit();">Enviar</button>
          </form>
          <div id="respuesta" class="my-3"></div>
        </div>
        <div id="contenido" class="col-md-4"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="/js/form.js"></script>
  </body>
</html>
